<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transfer - TRC-20</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root {
            --blue-primary: #1E4DFF;
            --btn-purple: #9DA3FF;
            --bg-pill: #F4F4F6;
            --text-label: #646464;
            --border-light: #EFEFEF;
            --tron-orange: #FF060A;
            --success: #00C853;
            --error: #FF3D00;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; background: #fff; display: flex; flex-direction: column; overflow: hidden; }
        .content { flex: 1; padding: 10px 20px; overflow-y: auto; }
        .section { margin-top: 15px; }
        .label { font-size: 14.5px; color: var(--text-label); font-weight: 600; margin-bottom: 10px; display: block; }
        .input-group { display: flex; align-items: center; border: 1.8px solid var(--border-light); border-radius: 14px; height: 58px; padding: 0 16px; transition: 0.2s; position: relative; }
        .input-group.active { border-color: var(--blue-primary); border-width: 2px; }
        .input-group input { flex: 1; border: none; outline: none; font-size: 16px; font-weight: 500; color: #000; background: transparent; width: 100%; }
        #recipientInput { text-align: right; padding-right: 8px; }
        #amountInput { text-align: left; }
        .actions { display: flex; align-items: center; gap: 12px; }
        .blue-text { color: var(--blue-primary); font-weight: 700; font-size: 15px; cursor: pointer; user-select: none; }
        .blue-text:active { opacity: 0.6; }
        .clear-btn { width: 22px; height: 22px; background: #5F6368; border-radius: 50%; display: none; align-items: center; justify-content: center; cursor: pointer; margin-right: 5px; flex-shrink: 0; }
        .clear-btn::after { content: '×'; color: #FFFFFF; font-size: 18px; font-weight: 600; margin-top: -2px; }
        .icon-svg { width: 22px; height: 22px; fill: none; stroke: var(--blue-primary); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; cursor: pointer; }
        .icon-svg:active { opacity: 0.6; }
        .network-pill { display: inline-flex; align-items: center; background-color: var(--bg-pill); padding: 6px 12px; border-radius: 20px; gap: 8px; cursor: pointer; }
        .network-pill:active { opacity: 0.7; }
        .tron-logo-image { width: 20px; height: 20px; object-fit: contain; }
        .network-text { font-size: 14px; color: #555; font-weight: 600; }
        .footer { padding: 20px; }
        .next-btn { width: 100%; height: 56px; background-color: var(--btn-purple); color: #fff; border: none; border-radius: 30px; font-size: 17px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .next-btn.enabled { background-color: var(--blue-primary); }
        .next-btn.enabled:active { transform: scale(0.98); }
        .next-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .approx-txt { font-size: 13px; color: #9FA3A9; margin-top: 10px; font-weight: 500; }
        .error-msg { font-size: 12px; color: var(--error); margin-top: 6px; font-weight: 500; display: none; }
        .error-msg.show { display: block; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1a1a1a;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 10000;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }

        /* Status Bar */
        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: transparent;
            z-index: 9999;
            transition: background 0.3s;
        }
        .status-bar.active {
            background: linear-gradient(90deg, var(--tron-orange), var(--blue-primary), var(--tron-orange));
            background-size: 200% 100%;
            animation: slide 1.5s linear infinite;
        }
        @keyframes slide {
            0% { background-position: 0% 0; }
            100% { background-position: 200% 0; }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: #fff;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 340px;
            animation: pop 0.25s ease;
        }
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
        .modal-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-light); font-size: 14px; }
        .modal-row:last-of-type { border-bottom: none; }
        .modal-row .key { color: var(--text-label); font-weight: 500; }
        .modal-row .val { font-weight: 600; color: #000; word-break: break-all; text-align: right; max-width: 60%; }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btns button { flex: 1; height: 48px; border: none; border-radius: 24px; font-size: 15px; font-weight: 700; cursor: pointer; }
        .modal-btns .cancel { background: var(--bg-pill); color: #555; }
        .modal-btns .confirm { background: var(--blue-primary); color: #fff; }
        .modal-btns button:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <div class="status-bar" id="statusBar"></div>

    <div class="content">
        <div class="section" style="margin-top: 20px;">
            <label class="label">Address or Domain Name</label>
            <div class="input-group" id="addrGroup">
                <input type="text" id="recipientInput" value="TWd2zR4V1dFvJbXJZv3zQy4Xz5Zy6Zy7Z8" placeholder="Enter address">
                <div class="actions">
                    <div class="clear-btn" id="clearAddr"></div>
                    <span class="blue-text" id="pasteBtn">Paste</span>
                    <svg class="icon-svg" id="scanBtn" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2" /><line x1="3" y1="8" x2="6" y2="8" /><line x1="3" y1="12" x2="6" y2="12" /><line x1="3" y1="16" x2="6" y2="16" /></svg>
                    <svg class="icon-svg" id="addressBookBtn" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1-1h-3M8 20H5a1 1 0 0 1-1-1v-3" /><line x1="5" y1="12" x2="19" y2="12" /></svg>
                </div>
            </div>
            <div class="error-msg" id="addrError">Please enter a valid Tron address (starts with T, 34 chars)</div>
        </div>

        <div class="section">
            <label class="label">Destination network</label>
            <div class="network-pill" id="networkPill">
                <svg class="tron-logo-image" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L22 7L22 17L12 22L2 17L2 7L12 2Z" fill="#FF060A"/>
                    <path d="M12 6L17 8.5V13.5L12 16L7 13.5V8.5L12 6Z" fill="white"/>
                </svg>
                <span class="network-text">Tron (TRC-20)</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9FA3A9" stroke-width="4"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
        </div>

        <div class="section">
            <label class="label">Amount</label>
            <div class="input-group" id="amountGroup">
                <input type="number" id="amountInput" placeholder="0" inputmode="decimal" step="any" min="0">
                <div class="actions">
                    <div class="clear-btn" id="clearAmount"></div>
                    <span style="color: #616469; font-size: 14px; font-weight: 500;">USDT</span>
                    <span class="blue-text" id="maxBtn">Max</span>
                </div>
            </div>
            <div class="approx-txt">≈ $<span id="usdLabel">0.00</span></div>
            <div class="error-msg" id="amountError">Please enter a valid amount</div>
        </div>
    </div>

    <div class="footer">
        <button class="next-btn" id="nextBtn" disabled>Next</button>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <div class="modal-title">Confirm Transfer</div>
            <div class="modal-row"><span class="key">To</span><span class="val" id="modalTo">—</span></div>
            <div class="modal-row"><span class="key">Amount</span><span class="val" id="modalAmount">—</span></div>
            <div class="modal-row"><span class="key">Network</span><span class="val">Tron (TRC-20)</span></div>
            <div class="modal-row"><span class="key">Est. Fee</span><span class="val">~1.1 TRX</span></div>
            <div class="modal-btns">
                <button class="cancel" id="modalCancel">Cancel</button>
                <button class="confirm" id="modalConfirm">Confirm</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ───
            const $ = id => document.getElementById(id);
            const recipientInput = $('recipientInput');
            const amountInput = $('amountInput');
            const addrGroup = $('addrGroup');
            const amountGroup = $('amountGroup');
            const clearAddr = $('clearAddr');
            const clearAmount = $('clearAmount');
            const pasteBtn = $('pasteBtn');
            const maxBtn = $('maxBtn');
            const nextBtn = $('nextBtn');
            const usdLabel = $('usdLabel');
            const statusBar = $('statusBar');
            const scanBtn = $('scanBtn');
            const addressBookBtn = $('addressBookBtn');
            const networkPill = $('networkPill');
            const addrError = $('addrError');
            const amountError = $('amountError');
            const toast = $('toast');
            const confirmModal = $('confirmModal');
            const modalTo = $('modalTo');
            const modalAmount = $('modalAmount');
            const modalCancel = $('modalCancel');
            const modalConfirm = $('modalConfirm');

            // ─── State ───
            const state = {
                balance: 1000,        // simulated USDT balance
                price: 1.0,           // USDT/USD
                busy: false
            };

            // ─── Toast ───
            let toastTimer;
            function showToast(msg, type) {
                clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.className = 'toast show' + (type ? ' ' + type : '');
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
            }

            // ─── Validation ───
            function isValidTronAddress(addr) {
                return /^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(addr.trim());
            }

            function validateAddress(silent) {
                const v = recipientInput.value.trim();
                const ok = v.length === 0 || isValidTronAddress(v);
                addrError.classList.toggle('show', !ok && !silent);
                return ok;
            }

            function validateAmount(silent) {
                const v = amountInput.value.trim();
                if (v === '') { amountError.classList.remove('show'); return true; }
                const n = parseFloat(v);
                const ok = !isNaN(n) && n > 0 && n <= state.balance;
                amountError.textContent = (n > state.balance)
                    ? `Amount exceeds balance (${state.balance} USDT)`
                    : 'Please enter a valid amount';
                amountError.classList.toggle('show', !ok && !silent);
                return ok;
            }

            // ─── UI updates ───
            function updateClearButtons() {
                clearAddr.style.display = recipientInput.value.trim().length > 0 ? 'flex' : 'none';
                clearAmount.style.display = amountInput.value.trim().length > 0 ? 'flex' : 'none';
            }

            function updateUsdLabel() {
                const amt = parseFloat(amountInput.value) || 0;
                usdLabel.textContent = (amt * state.price).toFixed(2);
            }

            function updateNextButton() {
                const addr = recipientInput.value.trim();
                const amt = amountInput.value.trim();
                const valid = isValidTronAddress(addr) && amt !== '' && parseFloat(amt) > 0 && parseFloat(amt) <= state.balance;
                nextBtn.classList.toggle('enabled', valid);
                nextBtn.disabled = !valid || state.busy;
            }

            function refreshAll(silent) {
                updateClearButtons();
                validateAddress(silent);
                validateAmount(silent);
                updateUsdLabel();
                updateNextButton();
            }

            // ─── Event: inputs ───
            recipientInput.addEventListener('input', () => refreshAll(false));
            amountInput.addEventListener('input', () => refreshAll(false));

            recipientInput.addEventListener('focus', () => addrGroup.classList.add('active'));
            recipientInput.addEventListener('blur',  () => addrGroup.classList.remove('active'));
            amountInput.addEventListener('focus',    () => amountGroup.classList.add('active'));
            amountInput.addEventListener('blur',     () => amountGroup.classList.remove('active'));

            // Prevent Enter from doing anything weird
            recipientInput.addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });
            amountInput.addEventListener('keydown',    e => { if (e.key === 'Enter') e.preventDefault(); });

            // ─── Clear buttons ───
            clearAddr.addEventListener('click', () => {
                recipientInput.value = '';
                refreshAll(false);
                recipientInput.focus();
            });
            clearAmount.addEventListener('click', () => {
                amountInput.value = '';
                refreshAll(false);
                amountInput.focus();
            });

            // ─── Paste ───
            pasteBtn.addEventListener('click', async () => {
                try {
                    if (navigator.clipboard && navigator.clipboard.readText) {
                        const text = await navigator.clipboard.readText();
                        if (text) {
                            recipientInput.value = text.trim();
                            refreshAll(false);
                            showToast('Address pasted', 'success');
                            return;
                        }
                    }
                    throw new Error('Clipboard unavailable');
                } catch (err) {
                    const text = prompt('Paste address here:');
                    if (text) {
                        recipientInput.value = text.trim();
                        refreshAll(false);
                    }
                }
            });

            // ─── Max ───
            maxBtn.addEventListener('click', () => {
                amountInput.value = state.balance.toString();
                refreshAll(false);
                showToast(`Max: ${state.balance} USDT`, 'success');
            });

            // ─── Scan ───
            scanBtn.addEventListener('click', () => {
                showToast('QR scanner coming soon', '');
            });

            // ─── Address book ───
            addressBookBtn.addEventListener('click', () => {
                showToast('Address book coming soon', '');
            });

            // ─── Network pill ───
            networkPill.addEventListener('click', () => {
                showToast('Only Tron (TRC-20) available', '');
            });

            // ─── Next → open modal ───
            nextBtn.addEventListener('click', () => {
                if (nextBtn.disabled) return;
                if (!validateAddress(false) || !validateAmount(false)) {
                    showToast('Please fix errors first', 'error');
                    return;
                }
                modalTo.textContent = recipientInput.value.trim();
                modalAmount.textContent = parseFloat(amountInput.value).toFixed(2) + ' USDT';
                confirmModal.classList.add('show');
            });

            // ─── Modal cancel ───
            modalCancel.addEventListener('click', () => {
                confirmModal.classList.remove('show');
            });
            confirmModal.addEventListener('click', (e) => {
                if (e.target === confirmModal) confirmModal.classList.remove('show');
            });

            // ─── Modal confirm → simulate send ───
            modalConfirm.addEventListener('click', () => {
                confirmModal.classList.remove('show');
                if (state.busy) return;
                state.busy = true;
                updateNextButton();
                statusBar.classList.add('active');

                // Simulate network delay
                setTimeout(() => {
                    statusBar.classList.remove('active');
                    state.busy = false;
                    updateNextButton();
                    showToast('Transfer submitted successfully!', 'success');
                    // Optionally reset
                    // amountInput.value = '';
                    // refreshAll(false);
                }, 1800);
            });

            // ─── Initial ───
            refreshAll(true);
            // Show clear buttons on load if prefilled
            updateClearButtons();
        })();
    </script>
</body>
</html>
