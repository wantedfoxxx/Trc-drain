<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Transfer - TRC-20</title>
    <style>
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url(https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiA.woff2) format('woff2');
        }

        :root {
            --blue-primary: #1e80ff;
            --btn-purple: #a5b4fc;
            --bg-pill: #f4f5f7;
            --text-label: #474d66;
            --border-light: #eaecef;
            --tron-orange: #f75900;
            --bg-color: #ffffff;
            --danger: #f6465d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-label);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: transparent;
            z-index: 9999;
            background-size: 40px 4px;
        }
        .status-bar.active {
            background-image: linear-gradient(90deg, var(--tron-orange), var(--blue-primary), var(--tron-orange));
            animation: slide 1.2s linear infinite;
        }
        @keyframes slide {
            0% { background-position: 0 0; }
            100% { background-position: 40px 0; }
        }

        .content {
            flex: 1;
            padding: 10px 20px 20px;
            overflow-y: auto;
        }

        .form-group { margin-bottom: 24px; }

        .label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-label);
            margin-bottom: 12px;
            display: block;
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
            transition: border-color 0.15s;
        }
        .input-row.invalid { border-bottom-color: var(--danger); }

        .address-input {
            flex-grow: 1;
            border: none;
            outline: none;
            font-size: 14px;
            color: #1e2329;
            background: transparent;
            margin-right: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .address-input::placeholder { color: #848e9c; font-family: 'Inter', sans-serif; }

        .action-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-text {
            background: none;
            border: none;
            color: var(--blue-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: #848e9c;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }
        .btn-icon.hidden { visibility: hidden; }

        .network-pill {
            display: inline-flex;
            align-items: center;
            background-color: var(--bg-pill);
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 14px;
            color: #1e2329;
            gap: 8px;
        }

        .network-icon {
            width: 16px;
            height: 16px;
            background-color: var(--tron-orange);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
        }

        .amount-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
            transition: border-color 0.15s;
        }
        .amount-row.invalid { border-bottom-color: var(--danger); }

        .amount-input {
            flex-grow: 1;
            border: none;
            outline: none;
            font-size: 24px;
            font-weight: 500;
            color: #1e2329;
            background: transparent;
            width: 100%;
            font-variant-numeric: tabular-nums;
        }
        .amount-input::-webkit-outer-spin-button,
        .amount-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .amount-input[type=number] { -moz-appearance: textfield; appearance: textfield; }

        .amount-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .currency-label {
            font-size: 16px;
            font-weight: 600;
            color: #1e2329;
        }

        .fiat-subtext {
            font-size: 12px;
            color: #848e9c;
            margin-top: 8px;
            display: block;
        }
        .fiat-subtext.error { color: var(--danger); }

        .footer {
            padding: 16px 20px calc(24px + env(safe-area-inset-bottom));
        }

        .next-btn {
            width: 100%;
            background-color: var(--btn-purple);
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }
        .next-btn.ready { background-color: var(--blue-primary); }
        .next-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        @media (prefers-reduced-motion: reduce) {
            .status-bar.active { animation: none; }
        }
    </style>
</head>
<body>

    <div class="status-bar" id="statusBar" aria-hidden="true"></div>

    <form class="content" id="transferForm" novalidate>
        <div class="form-group">
            <label class="label" for="address">Address or Domain Name</label>
            <div class="input-row" id="addressRow">
                <input
                    type="text"
                    class="address-input"
                    id="address"
                    placeholder="Enter Tron (TRX) address"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    inputmode="text"
                    maxlength="42"
                    aria-describedby="addressError">
                <div class="action-group">
                    <button type="button" class="btn-icon hidden" id="clearBtn" aria-label="Clear address">✕</button>
                    <button type="button" class="btn-text" id="pasteBtn">Paste</button>
                    <button type="button" class="btn-icon" id="scanBtn" aria-label="Scan QR">▣</button>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label class="label">Destination network</label>
            <div class="network-pill">
                <div class="network-icon">⬡</div>
                <span>Tron (TRC-20)</span>
                <span>▼</span>
            </div>
        </div>

        <div class="form-group">
            <label class="label" for="amount">Amount</label>
            <div class="amount-row" id="amountRow">
                <input
                    type="text"
                    class="amount-input"
                    id="amount"
                    placeholder="0"
                    inputmode="decimal"
                    autocomplete="off"
                    spellcheck="false"
                    aria-describedby="fiatValue">
                <div class="amount-right">
                    <span class="currency-label">USDT</span>
                    <button type="button" class="btn-text" id="maxBtn">Max</button>
                </div>
            </div>
            <span class="fiat-subtext" id="fiatValue">≈ $0.00</span>
        </div>
    </form>

    <div class="footer">
        <button type="submit" form="transferForm" class="next-btn" id="nextBtn" disabled>Next</button>
    </div>

    <script>
    (function () {
        'use strict';

        // ---- Tron Base58Check address validation (no external deps) ----
        var B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
        var B58_MAP = (function () {
            var m = {};
            for (var i = 0; i < B58.length; i++) m[B58[i]] = i;
            return m;
        })();

        function b58decode(str) {
            if (typeof str !== 'string' || str.length === 0) return null;
            var bytes = [0];
            for (var i = 0; i < str.length; i++) {
                var val = B58_MAP[str[i]];
                if (val === undefined) return null;
                var carry = val;
                for (var j = 0; j < bytes.length; j++) {
                    carry += bytes[j] * 58;
                    bytes[j] = carry & 0xff;
                    carry >>= 8;
                }
                while (carry > 0) {
                    bytes.push(carry & 0xff);
                    carry >>= 8;
                }
            }
            // leading zeros
            for (var k = 0; k < str.length && str[k] === '1'; k++) bytes.push(0);
            return bytes.reverse();
        }

        // SHA-256 (synchronous, tiny, public-domain style implementation)
        function sha256(bytes) {
            var K = [
                0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
                0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
                0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
                0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
                0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
                0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
                0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
                0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
            ];
            var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
            var l = bytes.length;
            var withOne = bytes.slice();
            withOne.push(0x80);
            while ((withOne.length % 64) !== 56) withOne.push(0);
            var bitLenHi = Math.floor((l * 8) / 0x100000000);
            var bitLenLo = (l * 8) >>> 0;
            withOne.push((bitLenHi >>> 24) & 0xff, (bitLenHi >>> 16) & 0xff, (bitLenHi >>> 8) & 0xff, bitLenHi & 0xff);
            withOne.push((bitLenLo >>> 24) & 0xff, (bitLenLo >>> 16) & 0xff, (bitLenLo >>> 8) & 0xff, bitLenLo & 0xff);

            var w = new Array(64);
            for (var off = 0; off < withOne.length; off += 64) {
                for (var t = 0; t < 16; t++) {
                    w[t] = (withOne[off + t*4] << 24) | (withOne[off + t*4 + 1] << 16) | (withOne[off + t*4 + 2] << 8) | (withOne[off + t*4 + 3]);
                }
                for (t = 16; t < 64; t++) {
                    var s0 = rotr(w[t-15],7) ^ rotr(w[t-15],18) ^ (w[t-15] >>> 3);
                    var s1 = rotr(w[t-2],17) ^ rotr(w[t-2],19) ^ (w[t-2] >>> 10);
                    w[t] = (w[t-16] + s0 + w[t-7] + s1) | 0;
                }
                var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
                for (t = 0; t < 64; t++) {
                    var S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
                    var ch = (e & f) ^ (~e & g);
                    var t1 = (h + S1 + ch + K[t] + w[t]) | 0;
                    var S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
                    var mj = (a & b) ^ (a & c) ^ (b & c);
                    var t2 = (S0 + mj) | 0;
                    h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
                }
                H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
                H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
            }
            var out = [];
            for (var i = 0; i < 8; i++) {
                out.push((H[i] >>> 24) & 0xff, (H[i] >>> 16) & 0xff, (H[i] >>> 8) & 0xff, H[i] & 0xff);
            }
            return out;
        }
        function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }

        function isValidTronAddress(addr) {
            if (typeof addr !== 'string') return false;
            addr = addr.trim();
            if (!/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(addr)) return false;
            var decoded = b58decode(addr);
            if (!decoded || decoded.length !== 25) return false;
            // payload = 21 bytes (0x41 prefix + 20 bytes), checksum = last 4
            var payload = decoded.slice(0, 21);
            if (payload[0] !== 0x41) return false;
            var checksum = decoded.slice(21, 25);
            var h1 = sha256(payload);
            var h2 = sha256(h1);
            for (var i = 0; i < 4; i++) if (checksum[i] !== h2[i]) return false;
            return true;
        }

        // ---- DOM refs ----
        var $ = function (id) { return document.getElementById(id); };
        var form       = $('transferForm');
        var addrInput  = $('address');
        var addrRow    = $('addressRow');
        var clearBtn   = $('clearBtn');
        var pasteBtn   = $('pasteBtn');
        var scanBtn    = $('scanBtn');
        var amtInput   = $('amount');
        var amtRow     = $('amountRow');
        var maxBtn     = $('maxBtn');
        var fiat       = $('fiatValue');
        var nextBtn    = $('nextBtn');
        var statusBar  = $('statusBar');

        var USDT_USD = 1.00;      // soft peg assumption
        var MAX_DECIMALS = 6;     // TRC-20 USDT precision
        var AVAIL_BALANCE = 0;    // wire to real balance later

        // ---- state ----
        var state = { address: '', amount: 0, addressValid: false, amountValid: false };

        // ---- sanitize helpers ----
        function sanitizeAmount(raw) {
            var s = String(raw).replace(/[^\d.]/g, '');
            var firstDot = s.indexOf('.');
            if (firstDot !== -1) {
                s = s.slice(0, firstDot + 1) + s.slice(firstDot + 1).replace(/\./g, '');
                var parts = s.split('.');
                parts[1] = (parts[1] || '').slice(0, MAX_DECIMALS);
                s = parts[0] + '.' + parts[1];
            }
            // strip leading zeros but keep one before dot
            s = s.replace(/^0+(?=\d)/, '');
            if (s === '' || s === '.') return '';
            return s;
        }

        function refresh() {
            // address UI
            var a = addrInput.value.trim();
            state.address = a;
            state.addressValid = isValidTronAddress(a);
            addrRow.classList.toggle('invalid', a.length > 0 && !state.addressValid);
            clearBtn.classList.toggle('hidden', a.length === 0);

            // amount UI
            var raw = amtInput.value;
            var clean = sanitizeAmount(raw);
            if (clean !== raw) {
                var caret = amtInput.selectionStart;
                amtInput.value = clean;
                try { amtInput.setSelectionRange(caret, caret); } catch (e) {}
            }
            var v = parseFloat(clean);
            if (!isFinite(v) || v < 0) v = 0;
            state.amount = v;
            state.amountValid = v > 0 && (!AVAIL_BALANCE || v <= AVAIL_BALANCE);
            amtRow.classList.toggle('invalid', clean.length > 0 && !state.amountValid);

            // fiat line
            if (clean.length === 0) {
                fiat.textContent = '≈ $0.00';
                fiat.classList.remove('error');
            } else if (!state.amountValid && AVAIL_BALANCE && v > AVAIL_BALANCE) {
                fiat.textContent = 'Exceeds available balance';
                fiat.classList.add('error');
            } else {
                fiat.textContent = '≈ $' + (v * USDT_USD).toFixed(2);
                fiat.classList.remove('error');
            }

            // next button
            var ready = state.addressValid && state.amountValid;
            nextBtn.disabled = !ready;
            nextBtn.classList.toggle('ready', ready);
        }

        // ---- events ----
        addrInput.addEventListener('input', refresh);
        addrInput.addEventListener('blur', refresh);
        addrInput.addEventListener('paste', function () { setTimeout(refresh, 0); });

        amtInput.addEventListener('input', refresh);
        amtInput.addEventListener('blur', refresh);

        clearBtn.addEventListener('click', function () {
            addrInput.value = '';
            addrInput.focus();
            refresh();
        });

        pasteBtn.addEventListener('click', function () {
            if (navigator.clipboard && navigator.clipboard.readText) {
                navigator.clipboard.readText().then(function (t) {
                    addrInput.value = (t || '').trim();
                    refresh();
                }).catch(function () {
                    addrInput.focus();
                });
            } else {
                addrInput.focus();
                document.execCommand && document.execCommand('paste');
            }
        });

        scanBtn.addEventListener('click', function () {
            // QR scanner hook — wire to BarcodeDetector or library later
            if ('BarcodeDetector' in window) {
                // placeholder: real flow opens camera + detects qr_code
            }
        });

        maxBtn.addEventListener('click', function () {
            if (AVAIL_BALANCE > 0) {
                amtInput.value = String(AVAIL_BALANCE);
                refresh();
            } else {
                amtInput.focus();
            }
        });

        form.addEventListener('submit', function (ev) {
            ev.preventDefault();
            if (!state.addressValid) { addrInput.focus(); return; }
            if (!state.amountValid)  { amtInput.focus();  return; }
            statusBar.classList.add('active');
            // Hand off to next screen / signing flow:
            var payload = { to: state.address, amount: state.amount, network: 'TRC-20', asset: 'USDT' };
            console.log('transfer:init', payload);
            setTimeout(function () { statusBar.classList.remove('active'); }, 1500);
        });

        // initial
        refresh();
    })();
    </script>
</body>
</html>
