<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer - TRC-20</title>
    <style>
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url(https://fonts.gstatic.com/s/inter/v12/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiA.woff2) format('woff2');
        }

        :root {
            --blue-primary: #1e80ff;
            --btn-purple: #a5b4fc;
            --bg-pill: #f4f5f7;
            --text-label: #474d66;
            --border-light: #eaecef;
            --tron-orange: #f75900;
            --bg-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-label);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: transparent;
            z-index: 9999;
        }
        .status-bar.active {
            background: linear-gradient(90deg, var(--tron-orange), var(--blue-primary));
            animation: slide 2s infinite ease-in-out;
        }
        @keyframes slide {
            0% { background-position: 0 0; }
            100% { background-position: 40px 0; }
        }

        .content {
            flex: 1;
            padding: 10px 20px 20px;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-label);
            margin-bottom: 12px;
            display: block;
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .address-input {
            flex-grow: 1;
            border: none;
            outline: none;
            font-size: 14px;
            color: #1e2329;
            background: transparent;
            margin-right: 12px;
            font-family: monospace;
        }
        .address-input::placeholder { color: #848e9c; font-family: 'Inter', sans-serif; }

        .action-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-text {
            background: none;
            border: none;
            color: var(--blue-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-icon {
            background: none;
            border: none;
            color: #848e9c;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .network-pill {
            display: inline-flex;
            align-items: center;
            background-color: var(--bg-pill);
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 14px;
            color: #1e2329;
            gap: 8px;
        }

        .network-icon {
            width: 16px;
            height: 16px;
            background-color: var(--tron-orange);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
        }

        .amount-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .amount-input {
            flex-grow: 1;
            border: none;
            outline: none;
            font-size: 24px;
            font-weight: 500;
            color: #1e2329;
            background: transparent;
            width: 100%;
        }
        .amount-input::-webkit-outer-spin-button,
        .amount-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .amount-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .currency-label {
            font-size: 16px;
            font-weight: 600;
            color: #1e2329;
        }

        .fiat-subtext {
            font-size: 12px;
            color: #848e9c;
            margin-top: 8px;
            display: block;
        }

        .footer {
            padding: 16px 20px 24px;
        }

        .next-btn {
            width: 100%;
            background-color: var(--btn-purple);
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .next-btn:hover { opacity: 0.9; }
        .next-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="status-bar" id="statusBar"></div>

    <div class="content">
        <div class="form-group">
            <label class="label">Address or Domain Name</label>
            <div class="input-row">
                <input type="text" class="address-input" id="address" placeholder="Enter Tron (TRX) address" value="TWd2zR4V1dFvJbXJZv3zQy4Xz5Zy6Zy7Z8">
                <div class="action-group">
                    <button type="button" class="btn-icon" id="clearBtn"></button>
                    <button type="button" class="btn-text" id="pasteBtn">Paste</button>
                    <button type="button" class="btn-icon"></button>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label class="label">Destination network</label>
            <div class="network-pill">
                <div class="network-icon">⬡</div>
                <span>Tron (TRC-20)</span>
                <span>▼</span>
            </div>
        </div>

        <div class="form-group">
            <label class="label">Amount</label>
            <div class="amount-row">
                <input type="number" class="amount-input" id="amount" placeholder="0" step="0.000001" min="0">
                <div class="amount-right">
                    <span class="currency-label">USDT</span>
                    <button type="button" class="btn-text" id="maxBtn">Max</button>
                </div>
            </div>
            <span class="fiat-subtext" id="fiatValue">≈ $0.00</span>
        </div>
    </div>

    <div class="footer">
        <button type="button" class="next-btn" id="nextBtn">Next</button>
    </div>

    <script>
    (function () {
        function boot() {
            var addressEl = document.getElementById('address');
            var amountEl  = document.getElementById('amount');
            var fiatEl    = document.getElementById('fiatValue');
            var nextBtn   = document.getElementById('nextBtn');
            var pasteBtn  = document.getElementById('pasteBtn');
            var clearBtn  = document.getElementById('clearBtn');
            var maxBtn    = document.getElementById('maxBtn');
            var statusBar = document.getElementById('statusBar');

            if (!addressEl || !amountEl || !nextBtn) return;

            var PRICE_USD = 1.0;
            var BALANCE   = 1000;

            function refresh() {
                var amt = parseFloat(amountEl.value) || 0;
                nextBtn.disabled = !(addressEl.value.trim().length > 0 && amt > 0);
                fiatEl.textContent = '\u2248 $' + (amt * PRICE_USD).toFixed(2);
            }

            document.addEventListener('input', function (e) {
                if (e.target === amountEl || e.target === addressEl) refresh();
            });

            if (pasteBtn) pasteBtn.addEventListener('click', function () {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    navigator.clipboard.readText().then(function (t) {
                        addressEl.value = (t || '').trim();
                        refresh();
                    }).catch(function () {});
                }
            });

            if (clearBtn) clearBtn.addEventListener('click', function () {
                addressEl.value = '';
                refresh();
            });

            if (maxBtn) maxBtn.addEventListener('click', function () {
                amountEl.value = String(BALANCE);
                refresh();
            });

            nextBtn.addEventListener('click', function () {
                if (nextBtn.disabled) return;
                if (statusBar) statusBar.classList.add('active');
            });

            refresh();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', boot);
        } else {
            boot();
        }
    })();
    </script>
</body>

    </script>
</body>
</html>
